services:
  mc:
    image: docker.io/itzg/minecraft-server
    environment:
      EULA: "true"
      TYPE: "FABRIC"
      SEED: "602763237087657757"
      DIFFICULTY: "hard"
      MODRINTH_PROJECTS: |
        fabric-api
        simple-voice-chat:beta
      OPS: |
        HaydarJohn
    ports:
      - "25565:25565"
      - "24454:24454/udp" # Make sure to change the voice chat port if you aren't using the default one
    volumes:
      - ./minecraftData:/data:z
    stdin_open: true
    tty: true
    restart: unless-stopped
volumes:
  data: {}